name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "StellarSimulcast-${{ steps.ver.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StellarSimulcast-${{ steps.ver.outputs.tag }}
          path: StellarSimulcast-*.apk

      # Release is tagged and titled only "vX.Y.Z". Re-pushing the same version replaces it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" "StellarSimulcast-$TAG.apk" --title "$TAG" --notes "" --target "$GITHUB_SHA"
